name: Scene preview

# Short preview of a room + sky (same tool as the real render), lands in R2 renders/previews/.
on:
  workflow_dispatch:
    inputs:
      station:
        description: "Room clip in R2"
        required: true
      space:
        description: "Sky clip in R2"
        required: true
      saturation:
        default: "1.0"
      name:
        default: preview

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_BUCKET: goodnight-orbit
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pillow
      - name: Make preview
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "tools")
          from render_job import fetch
          for p in ("${{ inputs.station }}", "${{ inputs.space }}"):
              assert fetch(p), p
          PY
          python tools/make_station_loop.py --station "${{ inputs.station }}" --space "${{ inputs.space }}" \
            --seconds 16 --room-saturation "${{ inputs.saturation }}" --out "renders/previews/${{ inputs.name }}.mp4"
          aws s3 cp "renders/previews/${{ inputs.name }}.mp4" "s3://$R2_BUCKET/renders/previews/${{ inputs.name }}.mp4" --endpoint-url "$R2_ENDPOINT" --only-show-errors
